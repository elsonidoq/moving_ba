bloquear con tu constancia.</p></div></div></div><div class="between top18 bottom10"><h3 class="no-marg">Explorar situaciones · demo</h3><span class="pill yellow">4 escenarios</span></div><div class="list">${Object.entries(SCENARIOS).map(([id,s])=>`<button class="scenario-option" onclick="runScenario('${id}')"><div class="between"><strong>${s.label}</strong><span class="arrow">›</span></div><small>${id==='sostenido'?'Celebrá varias semanas de práctica.':id==='pausa'?'Una pausa no borra tu camino.':id==='inactividad'?'Recibí una invitación para volver.':'Explorá alternativas tras faltar a una clase.'}</small></button>`).join('')}</div>`)}
function pageEditSituation(){return wrapper(`${topbar('Cambiar mi situación',true)}<h1>¿En qué momento estás hoy?</h1><p>Esta elección guía las recomendaciones. Tu historia, sesiones y logros no cambian.</p><div class="list">${Object.entries(PROFILES).map(([id,p])=>`<button class="cardbutton ${real.profile===id?'on':''}" onclick="changeSituation('${id}')"><strong>${p.title}</strong><div class="small muted">${p.subtitle}</div></button>`).join('')}</div><button class="btn full top18" onclick="go('profile')">Volver al perfil</button>`)}
function pageNotice(){let sc=SCENARIOS[ui.scenario];return wrapper(`<div class="scene"><div class="between"><strong>SIMULACIÓN</strong><button class="btn mini outline" onclick="resetScene()">Volver a hoy</button></div><p>Esta notificación recrea una situación posible.</p></div><div class="notification-wrap">${img('city_park')}<div class="lock-time"><strong>9:41</strong><span>Buenos Aires</span></div><button class="lock-notice" onclick="go('chat')"><div class="between"><strong>🟨 Buenos Aires te mueve</strong><span class="tiny">ahora</span></div><p>${sc.notify}</p><div class="small" style="color:#1c76a7;margin-top:8px;font-weight:800">Tocá para conversar ›</div></button></div><button class="btn full outline top12" onclick="resetScene()">Volver a hoy</button>`)}
function pageChat(){let sc=SCENARIOS[ui.scenario];let answer=ui.chatAnswer===null?null:sc.options[ui.chatAnswer];return wrapper(`${topbar('Estamos para acompañarte',true)}${sceneBanner()}<div class="chat-bubble bot">${sc.intro}</div>${!answer?`<div class="top18">${sc.options.map((o,i)=>`<button class="chat-option" onclick="answerChat(${i})">${o.label}</button>`).join('')}</div>`:`<div class="chat-bubble me">${answer.label}</div><div class="chat-bubble bot">${answer.response}</div><button class="btn full top18" onclick="go('nextStep')">Ver mi próximo paso →</button>`}<button class="btn full outline top18" onclick="resetScene()">Volver a hoy</button>`)}
function pageNextStep(){let sc=SCENARIOS[ui.scenario];let choice=sc.options[ui.chatAnswer??sc.options.length-1];let sport=SP[choice.sport];let cls=sport.classes[0];return wrapper(`${topbar('Un paso posible',true)}${sceneBanner()}<h1>Seguimos a tu ritmo</h1><p>Esta opción puede ayudarte a recuperar una práctica que disfrutes.</p><div class="hero">${img(choice.mode==='clase'?cls.photo:sport.hero)}<div class="hero-copy"><h2>${choice.mode==='clase'?cls.name:sport.plan}</h2><p>${sport.name}</p></div></div><div class="softbox top12"><div class="small"><strong>¿Qué podés hacer ahora?</strong></div><p style="margin:6px 0 0">${choice.mode==='clase'?'Conocé los horarios y elegí el próximo encuentro.':'Probá una sesión accesible y retomá sin exigencias.'}</p></div><button class="btn full top18" onclick="viewSuggested()">${choice.mode==='clase'?'Ver la clase':'Conocer el plan'} →</button><button class="btn full outline top12" onclick="resetScene()">Volver a hoy</button>`)}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.cssText='display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:28px;max-width:350px;width:calc(100% - 40px);padding:15px;border-radius:15px;background:#112b3e;color:#fff;box-shadow:0 10px 35px #0005;font-size:13px;font-weight:800;z-index:50;text-align:center';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.style.display='none',2800)}
function render(){let pages={welcome:pageWelcome,onboarding:pageOnboarding,home:pageHome,sports:pageSports,sport:pageSport,classes:pageClasses,class:pageClass,plan:pagePlan,training:pageTraining,completed:pageCompleted,profile:pageProfile,editSituation:pageEditSituation,notice:pageNotice,chat:pageChat,nextStep:pageNextStep};D.innerHTML=(pages[ui.page]||pageHome)();navHTML();D.scrollTop=0}
function go(page){ui.previous=ui.page;ui.page=page;render()}function back(){let routes={welcome:'welcome',onboarding:'welcome',home:'home',sports:'home',sport:'home',classes:ui.previous==='sport'?'sport':'home',class:'classes',plan:'sport',training:'plan',completed:'home',profile:'home',editSituation:'profile',notice:'profile',chat:'notice',nextStep:'chat'};go(routes[ui.page]||'home')}
function selectSituation(id){real.profile=id;save();render()}function completeOnboarding(){if(!real.profile)return;real.onboarded=true;save();go('home')}function changeSituation(id){real.profile=id;save();render()}
function openSport(sport){ui.sport=sport;go('sport')}function openMode(mode){ui.mode=mode;if(mode==='clase')go('classes');else go('plan')}function openClass(sport,idx){ui.sport=sport;ui.classIdx=idx;go('class')}
function reserve(){if(ui.scenario)return;let c=SP[ui.sport].classes[ui.classIdx];real.booked={name:c.name,day:c.day,place:c.place,sport:ui.sport,idx:ui.classIdx};save();go('home');showToast('¡Listo, genial! Te esperamos 🙌')}
function startTraining(){if(ui.scenario)return;ui.exerciseIndex=0;go('training')}function nextExercise(){let max=SP[ui.sport].exercises.length;if(ui.exerciseIndex<max-1){ui.exerciseIndex++;render()}else{real.sessions+=1;real.points+=50;save();go('completed')}}function previousExercise(){if(ui.exerciseIndex>0){ui.exerciseIndex--;render()}}
function runScenario(id){ui.scenario=id;ui.chatAnswer=null;ui.simChoice=null;if(id==='inactividad'||id==='clasePerdida'){go('notice')}else go('home')}
function resetScene(){ui.scenario=null;ui.chatAnswer=null;ui.simChoice=null;go('home')}function answerChat(i){ui.chatAnswer=i;render()}function viewSuggested(){let o=SCENARIOS[ui.scenario].options[ui.chatAnswer??0];ui.sport=o.sport;ui.mode=o.mode;if(o.mode==='clase'){ui.classIdx=0;go('class')}else go('plan')}
render();
</script></body></html>
